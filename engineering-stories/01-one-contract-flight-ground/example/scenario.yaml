scenario:
  id: engineering_story_flight_ground_stop_acquisition
  name: Flight-ground stop acquisition verification
  description: >
    Send the canonical payload stop command and verify that the live F Prime
    realization reports acquisition inactive through OpenC3 COSMOS.

mission:
  path: ../../../mission

initial_state:
  mode: PAYLOAD_ACTIVE
  telemetry:
    radiation_payload.acquisition_active: true

steps:
  - t: 1
    command: payload.stop_acquisition

  - t: 2
    expect_telemetry:
      radiation_payload.acquisition_active: false
