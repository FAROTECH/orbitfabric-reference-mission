data_products:
  - id: critical_housekeeping
    producer: obc
    producer_type: subsystem
    type: diagnostic_dump
    estimated_size_bytes: 512
    priority: critical
    storage:
      class: housekeeping
      retention: 7d
      overflow_policy: drop_oldest
    downlink:
      policy: priority_based
    description: Critical housekeeping product generated from essential OBC and EPS telemetry.

  - id: radiation_histogram
    producer: radiation_event_payload
    producer_type: payload
    type: histogram
    estimated_size_bytes: 4096
    priority: high
    payload: radiation_event_payload
    storage:
      class: science
      retention: 30d
      overflow_policy: drop_oldest
    downlink:
      policy: priority_based
    description: Radiation histogram product generated by the payload after an acquisition session.

  - id: scenario_evidence_log
    producer: obc
    producer_type: subsystem
    type: diagnostic_dump
    estimated_size_bytes: 2048
    priority: medium
    storage:
      class: engineering
      retention: 14d
      overflow_policy: drop_oldest
    downlink:
      policy: deferred
    description: Engineering evidence log associated with scenario execution and operational review.
